<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="com.deepin.system.IPWatchD"/>
    <allow send_destination="com.deepin.system.IPWatchD"
           send_interface="com.deepin.system.IPWatchD"
           send_member="SetAllowCaller"/>
    <allow send_destination="com.deepin.system.IPWatchD"
           send_interface="com.deepin.system.IPWatchD"
           send_member="GetAllowCallers"/>
  </policy>

  <policy group="deepin-daemon">
    <allow send_destination="com.deepin.system.IPWatchD"
           send_interface="com.deepin.system.IPWatchD"
           send_member="SetAllowCaller"/>
  </policy>

  <policy context="default">
    <deny send_destination="*"
         send_interface="com.deepin.system.IPWatchD"
         send_member="SetAllowCaller"/>
    <deny send_destination="*"
         send_interface="com.deepin.system.IPWatchD"
         send_member="GetAllowCallers"/>
  </policy>

  <!-- Allow anyone to invoke methods on the interfaces -->
  <policy context="default">
    <allow send_destination="com.deepin.system.IPWatchD"
           send_interface="org.freedesktop.DBus.Introspectable"/>

    <allow send_destination="com.deepin.system.IPWatchD"
           send_interface="org.freedesktop.DBus.Peer"/>

    <allow send_destination="com.deepin.system.IPWatchD"
           send_interface="org.freedesktop.DBus.Properties"/>

    <allow send_destination="com.deepin.system.IPWatchD"
           send_interface="com.deepin.system.IPWatchD"
           send_member="RequestIPConflictCheck"/>

  </policy>

</busconfig>
